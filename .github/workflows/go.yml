name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21.6

      - name: Instalar dependências
        run: go mod tidy

      - name: Build do projeto
        run: go build ./...

      - name: Executar testes com cobertura
        run: go test -cover -coverpkg=./api/... -coverprofile=coverage.out ./api -v

      - name: Gerar badge de cobertura
        run: bash coverage_badge.sh

      - name: Commitar e Atualizar Badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualizar badge de cobertura"
          branch: main
          file_pattern: coverage.svg